services:
  - type: web
    name: roasify-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # GrowifyOS Live Sync integration — set real values in the Render
      # dashboard, never commit them here.
      - key: GROWIFYOS_API_KEY
        sync: false
      - key: GROWIFYOS_BASE_URL
        value: ""