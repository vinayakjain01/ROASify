services:
  - type: web
    name: roasify-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # GrowifyOS Live Sync integration — set real values in the Render
      # dashboard, never commit them here.
      - key: GROWIFYOS_API_KEY
        sync: false
      - key: GROWIFYOS_BASE_URL
        value: ""
      # Supabase — team/user/brand-access data. Use the pooler connection
      # string for DATABASE_URL (db.<ref>.supabase.co is IPv6-only).
      - key: SUPABASE_URL
        value: ""
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        value: ""
      - key: DATABASE_URL
        sync: false