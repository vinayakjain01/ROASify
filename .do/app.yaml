# .do/app.yaml — DigitalOcean App Platform spec
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/

name: roasify

# ── BACKEND SERVICE ────────────────────────────────────────────────────────
services:
  - name: api
    source_dir: /backend
    dockerfile_path: backend/Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: CORS_ORIGINS
        value: "${APP_URL}"
        scope: RUN_TIME
      - key: PORT
        value: "8000"
        scope: RUN_AND_BUILD_TIME
    routes:
      - path: /api
      - path: /health

# ── FRONTEND STATIC SITE ───────────────────────────────────────────────────
static_sites:
  - name: frontend
    source_dir: /
    build_command: npm run build && npm run export
    output_dir: out
    environment_slug: node-js
    envs:
      - key: NEXT_PUBLIC_API_URL
        value: "${APP_URL}"
        scope: BUILD_TIME
      - key: NODE_VERSION
        value: "20"
        scope: BUILD_TIME
    routes:
      - path: /