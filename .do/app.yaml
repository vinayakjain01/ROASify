# .do/app.yaml — DigitalOcean App Platform spec
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/

name: roasify

# ── BACKEND SERVICE ────────────────────────────────────────────────────────
services:
  - name: api
    source_dir: backend
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: CORS_ORIGINS
        value: "${APP_URL}"
        scope: RUN_TIME
      - key: PORT
        value: "8000"
        scope: RUN_AND_BUILD_TIME
      # GrowifyOS Live Sync integration — set the real key value in the
      # DigitalOcean dashboard (App Settings > Environment Variables),
      # never commit it here.
      - key: GROWIFYOS_API_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: GROWIFYOS_BASE_URL
        value: ""
        scope: RUN_TIME
      # Supabase — team/user/brand-access data. Set real values in the
      # DigitalOcean dashboard, never commit them here. Use the pooler
      # connection string for DATABASE_URL (db.<ref>.supabase.co is
      # IPv6-only and won't reach most App Platform regions).
      - key: SUPABASE_URL
        value: ""
        scope: RUN_TIME
      - key: SUPABASE_SECRET_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_JWKS_URL
        value: ""
        scope: RUN_TIME
      - key: DATABASE_URL
        value: ""
        scope: RUN_TIME
        type: SECRET
    routes:
      - path: /api
      - path: /health

# ── FRONTEND STATIC SITE ───────────────────────────────────────────────────
static_sites:
  - name: frontend
    source_dir: .
    build_command: npm run build
    output_dir: out
    environment_slug: node-js
    envs:
      - key: NEXT_PUBLIC_API_URL
        value: "${APP_URL}"
        scope: BUILD_TIME
      # Supabase login — the publishable key is safe to expose (browser-side
      # by design); set real values in the DigitalOcean dashboard.
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: ""
        scope: BUILD_TIME
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        value: ""
        scope: BUILD_TIME
      - key: NODE_VERSION
        value: "22"
        scope: BUILD_TIME
    routes:
      - path: /